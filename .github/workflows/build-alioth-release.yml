name: Automatic kernel building for Alioth on newly created release

on:
  release:
    types: [created]

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        config:
          - name: "KernelSU-Next Only"
            KERNEL_TREE: "https://github.com/Impqxr/kernel_xiaomi_sm8250"
            KERNEL_TREE_BRANCH: "base"

            KERNELSU_NAME: "KSUN"
            KERNELSU_SETUP_URL: "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next/kernel/setup.sh"
            KERNELSU_SETUP_BRANCH: "next"
            KERNELSU_PATCHES: ""

            ANYKERNEL_URL: "https://github.com/Impqxr/AKalioth"
            ANYKERNEL_BRANCH: "main"
            ANYKERNEL_ZIP_NAME: "N0Kernel-alioth-${{ github.event.release.tag_name }}"
            CLANG_DOWNLOAD_URL: "https://github.com/Impqxr/aosp_clang_ci/releases/download/13289611/clang-13289611-linux-x86.tar.xz"

          - name: "KernelSU-Next with SuSFS"
            KERNEL_TREE: "https://github.com/Impqxr/kernel_xiaomi_sm8250"
            KERNEL_TREE_BRANCH: "susfs-v1.5.5"

            KERNELSU_NAME: "KSUN"
            KERNELSU_SETUP_URL: "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next/kernel/setup.sh"
            KERNELSU_SETUP_BRANCH: "next"
            KERNELSU_PATCHES: "https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/next/0001-kernel-implement-susfs-v1.5.5-v1.5.7-KSUN-v1.0.8.patch" # TODO: move it to my repo

            ANYKERNEL_URL: "https://github.com/Impqxr/AKalioth"
            ANYKERNEL_BRANCH: "main"
            ANYKERNEL_ZIP_NAME: "N0Kernel-alioth-${{ github.event.release.tag_name }}"
            CLANG_DOWNLOAD_URL: "https://github.com/Impqxr/aosp_clang_ci/releases/download/13289611/clang-13289611-linux-x86.tar.xz"

          - name: "Rissu's KernelSU Only"
            KERNEL_TREE: "https://github.com/Impqxr/kernel_xiaomi_sm8250"
            KERNEL_TREE_BRANCH: "base"

            KERNELSU_NAME: "RKSU"
            KERNELSU_SETUP_URL: "https://raw.githubusercontent.com/rsuntk/KernelSU/refs/heads/main/kernel/setup.sh"
            KERNELSU_SETUP_BRANCH: "main"
            KERNELSU_PATCHES: ""

            ANYKERNEL_URL: "https://github.com/Impqxr/AKalioth"
            ANYKERNEL_BRANCH: "main"
            ANYKERNEL_ZIP_NAME: "N0Kernel-alioth-${{ github.event.release.tag_name }}"
            CLANG_DOWNLOAD_URL: "https://github.com/Impqxr/aosp_clang_ci/releases/download/13289611/clang-13289611-linux-x86.tar.xz"

          - name: "Rissu's KernelSU with SuSFS"
            KERNEL_TREE: "https://github.com/Impqxr/kernel_xiaomi_sm8250"
            KERNEL_TREE_BRANCH: "susfs-v1.5.5"

            KERNELSU_NAME: "RKSU"
            KERNELSU_SETUP_URL: "https://raw.githubusercontent.com/rsuntk/KernelSU/refs/heads/susfs-main/kernel/setup.sh"
            KERNELSU_SETUP_BRANCH: "susfs-main"
            KERNELSU_PATCHES: ""

            ANYKERNEL_URL: "https://github.com/Impqxr/AKalioth"
            ANYKERNEL_BRANCH: "main"
            ANYKERNEL_ZIP_NAME: "N0Kernel-alioth-${{ github.event.release.tag_name }}"
            CLANG_DOWNLOAD_URL: "https://github.com/Impqxr/aosp_clang_ci/releases/download/13289611/clang-13289611-linux-x86.tar.xz"
    steps:
      - name: Display Inputs
        run: |
          echo "::group::Inputs"
          echo "Kernel Tree: ${{ matrix.config.KERNEL_TREE }}/tree/${{ matrix.config.KERNEL_TREE_BRANCH }}"
          echo "KernelSU Setup URL": ${{ matrix.config.KERNELSU_SETUP_URL }}
          echo "KernelSU Branch": ${{ matrix.config.KERNELSU_SETUP_BRANCH }}
          echo "KernelSU Name": ${{ matrix.config.KERNELSU_NAME }}
          echo "KernelSU Patches": ${{ matrix.config.KERNELSU_PATCHES }}
          echo "AnyKernel URL: ${{ matrix.config.ANYKERNEL_URL }}/tree/${{ matrix.config.ANYKERNEL_BRANCH }}"
          echo "::endgroup::"

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-ci
          restore-keys: |
            clang-

      - name: Download and Extract Clang (if not cached)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget "${{ matrix.config.CLANG_DOWNLOAD_URL }}" -O clang.tar.gz
          mkdir -p clang
          tar -xf clang.tar.gz -C clang

          # extract toolchain from the parent directory (if exists)
          cd clang
          if [ -d clang-* ]; then
            mv clang-*/* .
          fi

          cd ..
          rm clang.tar.gz

      - name: Initialize workspace
        run: |
          echo "tools_folder=$(pwd)" >> "$GITHUB_OUTPUT"
          git clone --depth=1 ${{ matrix.config.KERNEL_TREE }} -b ${{ matrix.config.KERNEL_TREE_BRANCH }} kernel_tree
          echo "kernel_folder=$(pwd)/kernel_tree" >> "$GITHUB_OUTPUT"
        id: workspace

      - name: Building kernel
        run: |
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="${{ github.actor }}"
          export KBUILD_BUILD_HOST="github.com"

          if [[ -n "${{ matrix.config.KERNELSU_SETUP_URL }}" && -n "${{ matrix.config.KERNELSU_SETUP_BRANCH }}" ]]; then
            curl -LSs "${{ matrix.config.KERNELSU_SETUP_URL }}" | bash -s ${{ matrix.config.KERNELSU_SETUP_BRANCH }}
            if [ -n "${{ matrix.config.KERNELSU_PATCHES }}" ]; then
              cd Kernel*
              echo "${{ matrix.config.KERNELSU_PATCHES }}" | tr ',' '\n' | while read -r PATCH; do
                TRIMMED=$(echo "$PATCH" | xargs)
                TEMP_PATCH_FILE="/tmp/downloaded_patch_$(date +%s%N).patch"
                curl -fsSL "$TRIMMED" -o "$TEMP_PATCH_FILE"
                patch -p1 < "$TEMP_PATCH_FILE"
              done
              cd ..
            fi
          fi

          make O=out vendor/alioth_defconfig PATH="${{ steps.workspace.outputs.tools_folder }}/clang/bin:$PATH"
          make O=out CC=clang -j$(nproc --all) PATH="${{ steps.workspace.outputs.tools_folder }}/clang/bin:$PATH" CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 2>&1 | tee build.log

          SUSFS_VERSION=$(grep -oP '(?<=-- SUSFS_VERSION: )v[\d.]+' build.log || echo "")
          echo "SUSFS_VERSION=$SUSFS_VERSION" >> "$GITHUB_OUTPUT"

          KSU_VERSION="$(sed -nE 's/.*-- KernelSU(-Next)? version: ([0-9]+).*/\2/p' build.log)"

          # fallback if we couldn't extract version
          if [ -z "$KSU_VERSION" ]; then
            cd Kernel*
            KSU_VERSION="$(( $(git rev-list --count HEAD) + 10200 ))"
            cd ..
          fi
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_OUTPUT"
        working-directory: ${{ steps.workspace.outputs.kernel_folder }}
        id: build

      - name: AnyKernel3
        if: ${{ success() }}
        run: |
          echo "KSU_VERSION is ${{ steps.build.outputs.KSU_VERSION }}, SUSFS_VERSION is ${{ steps.build.outputs.SUSFS_VERSION }}"

          FINAL_ZIP_NAME="${{ matrix.config.ANYKERNEL_ZIP_NAME }}"
          FINAL_DISPLAY_NAME="N0Kernel alioth"

          if [ -n "${{ steps.build.outputs.KSU_VERSION }}" ]; then
            FINAL_ZIP_NAME="${FINAL_ZIP_NAME}-${{ matrix.config.KERNELSU_NAME }}-${{ steps.build.outputs.KSU_VERSION }}"

            if [ "${{ matrix.config.KERNELSU_NAME }}" == "KSUN" ]; then
              FINAL_DISPLAY_NAME="${FINAL_DISPLAY_NAME} : KernelSU Next ${{ steps.build.outputs.KSU_VERSION }}"
            elif [ "${{ matrix.config.KERNELSU_NAME }}" == "RKSU" ]; then
              FINAL_DISPLAY_NAME="${FINAL_DISPLAY_NAME} : Rissu's KernelSU ${{ steps.build.outputs.KSU_VERSION }}"
            else
              FINAL_DISPLAY_NAME="${FINAL_DISPLAY_NAME} : ${{ matrix.config.KERNELSU_NAME }} ${{ steps.build.outputs.KSU_VERSION }}"
            fi
          else
            FINAL_ZIP_NAME="${FINAL_ZIP_NAME}-NONKSU"
            FINAL_DISPLAY_NAME="${FINAL_DISPLAY_NAME} : No root"
          fi
          if [ -n "${{ steps.build.outputs.SUSFS_VERSION }}" ]; then
            FINAL_ZIP_NAME="${FINAL_ZIP_NAME}-SUSFS-${{ steps.build.outputs.SUSFS_VERSION }}"
            FINAL_DISPLAY_NAME="${FINAL_DISPLAY_NAME} : SuSFS ${{ steps.build.outputs.SUSFS_VERSION }}"
          fi

          echo "ZIP name is $FINAL_ZIP_NAME"
          echo "Display name is $FINAL_DISPLAY_NAME"

          git clone --recursive --depth=1 ${{ matrix.config.ANYKERNEL_URL }} -b ${{ matrix.config.ANYKERNEL_BRANCH }} AnyKernel3
          if [ -e "Image.gz" ]; then
            cp -f Image.gz AnyKernel3
          fi
          if [ -e "dtb.img" ]; then
            cp -f dtb.img AnyKernel3/dtb
          fi
          if [ -e "dtbo.img" ] && [ ${{ matrix.config.ANYKERNEL_HYPEROS_DTBO }} != "true" ]; then
            cp -f dtbo.img AnyKernel3
          fi
          cd AnyKernel3
          zip -q -r "$FINAL_ZIP_NAME.zip" *
          mv "$FINAL_ZIP_NAME.zip" ../
          cd ..
          echo "ZIP_PATH=$(pwd)/$FINAL_ZIP_NAME.zip" >> "$GITHUB_OUTPUT"
          echo "DISPLAY_NAME=$FINAL_DISPLAY_NAME" >> "$GITHUB_OUTPUT"
        working-directory: ${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/
        id: ak3
      - name: "Upload AnyKernel"
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.ak3.outputs.ZIP_PATH }}#${{ steps.ak3.outputs.DISPLAY_NAME }}" --repo $GITHUB_REPOSITORY
