name: Kernel Build Alioth Releases

on:
  release:
    types: [created]

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        config:
          - name: "KernelSU-Next Only"
            KERNEL_TREE: "https://github.com/Impqxr/kernel_xiaomi_sm8250"
            KERNEL_TREE_BRANCH: "base"

            ADD_KERNELSU: true
            KERNELSU_NAME: "KSUN"
            KERNELSU_SETUP_URL: "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next/kernel/setup.sh"
            KERNELSU_SETUP_BRANCH: "next"

            ANYKERNEL_URL: "https://github.com/Impqxr/AKalioth"
            ANYKERNEL_BRANCH: "main"
            ANYKERNEL_ZIP_NAME: "N0kernel-alioth-${{ github.event.release.name }}"
            ANYKERNEL_HYPEROS_DTBO: false

          - name: "KernelSU-Next with SuSFS"
            KERNEL_TREE: "https://github.com/Impqxr/kernel_xiaomi_sm8250"
            KERNEL_TREE_BRANCH: "susfs-v1.5.5"

            ADD_KERNELSU: true
            KERNELSU_NAME: "KSUN"
            KERNELSU_SETUP_URL: "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh"
            KERNELSU_SETUP_BRANCH: "next-susfs-dev"

            ANYKERNEL_URL: "https://github.com/Impqxr/AKalioth"
            ANYKERNEL_BRANCH: "main"
            ANYKERNEL_ZIP_NAME: "N0kernel-alioth-${{ github.event.release.name }}"
            ANYKERNEL_HYPEROS_DTBO: false

          - name: "Rissu's KernelSU Only"
            KERNEL_TREE: "https://github.com/Impqxr/kernel_xiaomi_sm8250"
            KERNEL_TREE_BRANCH: "base"

            ADD_KERNELSU: true
            KERNELSU_NAME: "RKSU"
            KERNELSU_SETUP_URL: "https://raw.githubusercontent.com/rsuntk/KernelSU/refs/heads/main/kernel/setup.sh"
            KERNELSU_SETUP_BRANCH: "main"

            ANYKERNEL_URL: "https://github.com/Impqxr/AKalioth"
            ANYKERNEL_BRANCH: "main"
            ANYKERNEL_ZIP_NAME: "N0kernel-alioth-${{ github.event.release.name }}"
            ANYKERNEL_HYPEROS_DTBO: false

          - name: "Rissu's KernelSU with SuSFS"
            KERNEL_TREE: "https://github.com/Impqxr/kernel_xiaomi_sm8250"
            KERNEL_TREE_BRANCH: "susfs-v1.5.5"

            ADD_KERNELSU: true
            KERNELSU_NAME: "RKSU"
            KERNELSU_SETUP_URL: "https://raw.githubusercontent.com/rsuntk/KernelSU/refs/heads/susfs-v1.5.5/kernel/setup.sh"
            KERNELSU_SETUP_BRANCH: "susfs-v1.5.5"

            ANYKERNEL_URL: "https://github.com/Impqxr/AKalioth"
            ANYKERNEL_BRANCH: "main"
            ANYKERNEL_ZIP_NAME: "N0kernel-alioth-${{ github.event.release.name }}"
            ANYKERNEL_HYPEROS_DTBO: false
    steps:
      - name: Display Inputs
        run: |
          echo "::group::Inputs"
          echo "Kernel Tree: ${{ matrix.config.KERNEL_TREE }}/tree/${{ matrix.config.KERNEL_TREE_BRANCH }}"
          echo "Add KernelSU: ${{ matrix.config.ADD_KERNELSU }}"
          echo "KernelSU Setup URL": ${{ matrix.config.KERNELSU_SETUP_URL }}
          echo "KernelSU Branch": ${{ matrix.config.KERNELSU_SETUP_BRANCH }}
          echo "KernelSU Name": ${{ matrix.config.KERNELSU_NAME }}
          echo "AnyKernel URL: ${{ matrix.config.ANYKERNEL_URL }}/tree/${{ matrix.config.ANYKERNEL_BRANCH }}"
          echo "Use DTBO for HyperOS/MIUI for AnyKernel": ${{ matrix.config.ANYKERNEL_HYPEROS_DTBO }}
          echo "::endgroup::"

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-r547379
          restore-keys: |
            clang-

      - name: Download and Extract Clang (if not cached)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
          mkdir -p clang
          tar -xf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Initialize workspace
        run: |
          echo "tools_folder=$(pwd)" >> $GITHUB_OUTPUT

          sudo apt install flex libncurses6 -y

          git clone --depth=1 ${{ matrix.config.KERNEL_TREE }} -b ${{ matrix.config.KERNEL_TREE_BRANCH }} kernel_tree
          echo "kernel_folder=$(pwd)/kernel_tree" >> $GITHUB_OUTPUT
        id: workspace

      - name: Building kernel
        run: |
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="never"
          export KBUILD_BUILD_HOST="worry"

          if [ ${{ matrix.config.ADD_KERNELSU }} == 'true' ]; then
            curl -LSs "${{ matrix.config.KERNELSU_SETUP_URL }}" | bash -s ${{ matrix.config.KERNELSU_SETUP_BRANCH }}
          fi

          make O=out vendor/alioth_defconfig PATH="${{ steps.workspace.outputs.tools_folder }}/clang/bin:$PATH"
          make O=out CC=clang -j$(nproc --all) PATH="${{ steps.workspace.outputs.tools_folder }}/clang/bin:$PATH" CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 2>&1 | tee build.log

          echo "KSU_VERSION=$(sed -nE 's/.*-- KernelSU(-Next)? version: ([0-9]+).*/\2/p' build.log)" >> $GITHUB_OUTPUT
          echo "SUSFS_VERSION=$(grep -oP '(?<=-- SUSFS_VERSION: )v[\d.]+' build.log || echo "")" >> $GITHUB_OUTPUT
        working-directory: ${{ steps.workspace.outputs.kernel_folder }}
        id: build

      - name: AnyKernel3
        if: ${{ success() }}
        run: |
          echo "KSU_VERSION is ${{ steps.build.outputs.KSU_VERSION }}, SUSFS_VERSION is ${{ steps.build.outputs.SUSFS_VERSION }}"

          FINAL_ZIP_NAME="${{ matrix.config.ANYKERNEL_ZIP_NAME }}"

          if [ -n "${{ steps.build.outputs.KSU_VERSION }}" ]; then
            FINAL_ZIP_NAME="${FINAL_ZIP_NAME}-${{ matrix.config.KERNELSU_NAME }}-${{ steps.build.outputs.KSU_VERSION }}"
          else
            FINAL_ZIP_NAME="${FINAL_ZIP_NAME}-NONKSU"
          fi
          if [ -n "${{ steps.build.outputs.SUSFS_VERSION }}" ]; then
            FINAL_ZIP_NAME="${FINAL_ZIP_NAME}-SUSFS-${{ steps.build.outputs.SUSFS_VERSION }}"
          fi

          echo "ZIP name is $FINAL_ZIP_NAME"

          git clone --recursive --depth=1 ${{ matrix.config.ANYKERNEL_URL }} -b ${{ matrix.config.ANYKERNEL_BRANCH }} AnyKernel3
          if [ -e "Image.gz" ]; then
            cp -f Image.gz AnyKernel3
          fi
          if [ -e "dtb.img" ]; then
            cp -f dtb.img AnyKernel3/dtb
          fi
          if [ -e "dtbo.img" ] && [ ${{ matrix.config.ANYKERNEL_HYPEROS_DTBO }} != "true" ]; then
            cp -f dtbo.img AnyKernel3
          fi
          cd AnyKernel3
          zip -q -r "$FINAL_ZIP_NAME.zip" *
          mv "$FINAL_ZIP_NAME.zip" ../
          cd ..
          echo "ZIP_PATH=$(pwd)/$FINAL_ZIP_NAME.zip" >> $GITHUB_OUTPUT
        working-directory: ${{ steps.workspace.outputs.kernel_folder }}/out/arch/arm64/boot/
        id: ak3
      - name: "Upload AnyKernel"
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          files: ${{ steps.ak3.outputs.ZIP_PATH }}
